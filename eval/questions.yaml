# Golden questions for `lens eval`. Paths are relative to the data directory (data-storage/).
# `expect`: one or more files; a hit in any of them counts. `expect: []` marks a question the
# corpus should NOT answer (reported as an abstain rate, not recall).

# --- exact-term -------------------------------------------------------------
- q: "Do you support SCIM provisioning?"
  expect: ["product/feature-spec-auth.md"]
  tags: [exact-term, live]

- q: 'Do you require "TLS 1.3"?'
  expect: ["security/tls-and-encryption.md"]
  tags: [exact-term, live]

- q: "8443"
  expect: ["security/tls-and-encryption.md"]
  tags: [exact-term, live]

- q: "INC-0000"
  expect: ["operations/incident-contacts.md"]
  tags: [exact-term]

- q: "warm standby"
  expect: ["operations/incident-runbook.md"]
  tags: [exact-term, live]

- q: "What is the API rate-limit on the Starter tier?"
  expect: ["product/pricing-2023.md"]
  tags: [exact-term, stale]

- q: "GTM_TELESCOPE_LEXICAL_ONLY_MARKER_7f4c2b91"
  expect: ["lexical-only/marker.txt"]
  tags: [exact-term, marker]

