[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtm-telescope"
version = "1.0.0"
description = "A local multi-retrieval engine for GTM teams."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "jina-grep @ git+https://github.com/jina-ai/jina-grep-cli.git@d1e6b0e037e28301bdabda8e1991c00345faa30e",
  "python-dotenv>=1.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
calibrate = [
  "docling>=2.10",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
lens = "gtm_telescope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gtm_telescope"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "dist", "build", "resources"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
