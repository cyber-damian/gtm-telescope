# Default LLM configuration
llm:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4.1-mini"
  api_key_env: "OPENAI_API_KEY"
  env_file: ".env"

# Default data storage directory
storage:
  data_dir: "data-storage"

# Embedding server + vector cache (optional; defaults match gtm_telescope.config)
embedding:
  server_url: "http://localhost:8089"
  model: "jina-embeddings-v5-nano"
  # truncate_dim: 256
  embed_http_timeout: "60"
  embed_server_ready_sec: "60"
  # Max bytes per corpus file when indexing (0 = unlimited). Default 5242880 (5 MiB).
  max_file_bytes: "5242880"
  # Set to "true" only if embedding.server_url is not on localhost (SSRF guard).
  # allow_remote: "false"

# Hybrid retrieval tuning (optional)
retrieval:
  semantic_candidate_top_k: "15"
  semantic_threshold: "0.38"
  # markdown (default): heading-aware chunks with overlap. Also: line | paragraph | sentence | token
  semantic_granularity: "markdown"
  # Markdown chunker: target size, merge threshold (estimated tokens = chars / 3), line overlap
  chunk_tokens: "350"
  min_chunk_tokens: "40"
  chunk_overlap_lines: "2"
  # Lexical (SQLite FTS5 BM25) candidates per query
  lexical_top_k: "15"
  # Only used by the ripgrep fallback when SQLite FTS5 is unavailable
  lexical_max_lines: "500"
  # Reciprocal Rank Fusion: score = sum 1/(rrf_k + rank); boosts are added on top
  rrf_k: "60"
  # Added when a chunk contains every quoted phrase (or every term of a short query)
  exact_boost: "0.02"
  # Added for doc_type "card" chunks (no effect until cards exist)
  card_boost: "0.01"
  # Hits older than this are flagged "stale" (never demoted in ranking)
  stale_after_days: "365"
  # Limit results to 10 rows
  hybrid_report_max_rows: "10"
  # Show 3 blocks of context in the report
  hybrid_report_snippet_blocks: "3"
  hybrid_report_snippet_wrap: "88"
  # Max chunk rows loaded into RAM per cosine query (safety cap for huge corpora).
  max_chunk_rows: "500000"

# What `lens calibrate` does with PDF/Office files after converting them to Markdown
calibrate:
  # move: relocate to <data_dir>/.originals/ (default) | keep: leave in place | delete: remove
  originals: move

# Child process / LLM HTTP timeouts (seconds)
process:
  subprocess_timeout: "120"
  http_timeout: "120"
